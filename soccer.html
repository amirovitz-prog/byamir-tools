<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>CL Soccer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#0d1117; display:flex; align-items:center; justify-content:center; touch-action:none; }
canvas { display:block; }
#rotate-msg { position:fixed; inset:0; background:#0d1117; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; font-family:Arial,sans-serif; }
</style>
</head>
<body>
<canvas id="c" width="800" height="560"></canvas>
<div id="rotate-msg">
  <div style="font-size:60px;margin-bottom:16px">📱</div>
  <div style="font-size:22px;line-height:1.5">Rotate your device<br>to landscape for best play</div>
</div>

<script>
// ─── Canvas setup ──────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CW = 800, CH = 560;

function resize() {
  const scale = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  canvas.style.width  = (CW * scale) + 'px';
  canvas.style.height = (CH * scale) + 'px';
  // Portrait warning
  document.getElementById('rotate-msg').style.display =
    window.innerWidth < window.innerHeight && window.innerWidth < 500 ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
resize();

// ─── Layout constants ─────────────────────────────────────────────────────
const HUD_H = 52;
const F = { x:25, y:HUD_H+6, w:750, h:348 };       // field rect
const GH = Math.round(F.h * 0.27), GW = 12;          // goal size
const GL = { x: F.x,           y: F.y + F.h/2 - GH/2 };
const GR = { x: F.x+F.w-GW,   y: F.y + F.h/2 - GH/2 };
const CTRL_Y = F.y + F.h + 8;                        // control zone top
const PR = 14, BR = 9;                               // player/ball radius

// Control positions (canvas-space)
const JOY    = { cx:140, cy:505, r:64, knobR:26 };
const SHOOT  = { cx:665, cy:500, r:54 };
const SPRINT = { cx:555, cy:502, r:36 };

// ─── Audio ────────────────────────────────────────────────────────────────
let audioCtx = null, musicPlaying = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playNote(freq, t, dur, vol = 0.12) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.02);
  gain.gain.setValueAtTime(vol, t + dur - 0.05);
  gain.gain.linearRampToValueAtTime(0, t + dur);
  osc.start(t); osc.stop(t + dur);
}

function playCLAnthem() {
  if (!audioCtx || !musicPlaying) return;
  const b = 0.32;
  const notes = [
    [659,1],[659,.5],[587,.5],[659,1],[784,2],
    [740,1],[740,.5],[659,.5],[740,1],[880,2],
    [784,1],[784,.5],[740,.5],[784,1],[880,2],
    [1047,1],[988,1],[880,1],[784,1],
    [659,1],[659,.5],[587,.5],[659,1],[784,2],
    [740,1],[740,.5],[659,.5],[740,1],[523,2],
    [587,1],[659,1],[523,1],[440,1],[523,4]
  ];
  let t = audioCtx.currentTime + 0.1;
  notes.forEach(([f, beats]) => { playNote(f, t, beats*b - 0.04); t += beats*b; });
  const total = notes.reduce((s,[,b])=>s+b,0)*b;
  window._clTimer = setTimeout(() => playCLAnthem(), total * 1000);
}

function startMusic() { musicPlaying = true; playCLAnthem(); }
function stopMusic()  { musicPlaying = false; clearTimeout(window._clTimer); }

function playGoalSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [523,659,784,1047].forEach((f,i) => playNote(f, t+i*0.15, 0.4, 0.22));
}

// ─── Game state ───────────────────────────────────────────────────────────
let score = [0,0], half = 1, timeLeft = 120;
let gameState = 'waiting'; // waiting | playing | halftime | gameover
let lastTime = 0;
const keys = {};
let player, ball, aiPlayers;
let goalLock = false; // prevent double goal count

function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function norm(dx,dy){ const m=Math.hypot(dx,dy)||1; return [dx/m,dy/m]; }

function resetPositions() {
  goalLock = false;
  player = { x: F.x+F.w*.25, y: F.y+F.h/2, vx:0, vy:0, speed:3.6, team:0 };
  ball   = { x: F.x+F.w/2,   y: F.y+F.h/2, vx: (Math.random()-.5)*3, vy: (Math.random()-.5)*2 };
  aiPlayers = [
    {x:F.x+F.w*.64, y:F.y+F.h*.33, vx:0,vy:0, speed:2.7, team:1, role:'def'},
    {x:F.x+F.w*.64, y:F.y+F.h*.67, vx:0,vy:0, speed:2.7, team:1, role:'def'},
    {x:F.x+F.w*.80, y:F.y+F.h*.42, vx:0,vy:0, speed:2.9, team:1, role:'att'},
    {x:F.x+F.w*.80, y:F.y+F.h*.58, vx:0,vy:0, speed:2.9, team:1, role:'att'},
  ];
}

// ─── Touch input ──────────────────────────────────────────────────────────
const joy   = { active:false, id:null, baseX:JOY.cx, baseY:JOY.cy, dx:0, dy:0 };
const touch = { shoot:false, sprint:false, shootId:null, sprintId:null };
let shootCooldown = 0;

function toCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x:(clientX-r.left)*(CW/r.width), y:(clientY-r.top)*(CH/r.height) };
}

function isInControlZone(x, y) { return y > CTRL_Y; }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  if (gameState !== 'playing') { startGame(); return; }
  for (const t of e.changedTouches) {
    const p = toCanvas(t.clientX, t.clientY);
    if (!isInControlZone(p.x, p.y)) continue;
    if (p.x < CW * 0.45) {
      // Joystick zone
      if (!joy.active) {
        joy.active = true; joy.id = t.identifier;
        joy.baseX = clamp(p.x, 60, CW*0.44);
        joy.baseY = clamp(p.y, CTRL_Y+10, CH-20);
        joy.dx = 0; joy.dy = 0;
      }
    } else {
      // Button zone
      const dShoot  = dist({x:p.x,y:p.y}, {x:SHOOT.cx, y:SHOOT.cy});
      const dSprint = dist({x:p.x,y:p.y}, {x:SPRINT.cx,y:SPRINT.cy});
      if (dShoot < SHOOT.r + 18 && !touch.shoot) {
        touch.shoot = true; touch.shootId = t.identifier;
        triggerShoot();
      } else if (dSprint < SPRINT.r + 15 && !touch.sprint) {
        touch.sprint = true; touch.sprintId = t.identifier;
      }
    }
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      const p = toCanvas(t.clientX, t.clientY);
      let dx = p.x - joy.baseX, dy = p.y - joy.baseY;
      const mag = Math.hypot(dx, dy);
      if (mag > JOY.r) { dx *= JOY.r/mag; dy *= JOY.r/mag; }
      joy.dx = dx / JOY.r; joy.dy = dy / JOY.r;
    }
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id)        { joy.active=false; joy.id=null; joy.dx=0; joy.dy=0; }
    if (t.identifier === touch.shootId) { touch.shoot=false; touch.shootId=null; }
    if (t.identifier === touch.sprintId){ touch.sprint=false; touch.sprintId=null; }
  }
}, {passive:false});

// ─── Keyboard ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.code]=false; });

// ─── Shoot logic ─────────────────────────────────────────────────────────
function triggerShoot() {
  if (shootCooldown > 0) return;
  if (dist(player, ball) < PR + BR + 22) {
    const tx = GR.x, ty = GR.y + GH/2;
    const [bx, by] = norm(tx-ball.x, ty-ball.y);
    ball.vx = bx * 10 + player.vx * 0.4;
    ball.vy = by * 10 + player.vy * 0.4 + (Math.random()-.5)*2.5;
    shootCooldown = 0.35;
  }
}

// ─── AI ───────────────────────────────────────────────────────────────────
function getBallOwner() {
  if (dist(player, ball) < PR+BR+2) return 0;
  for (const a of aiPlayers) if (dist(a, ball) < PR+BR+2) return 1;
  return null;
}

function updateAI(ai) {
  const owner = getBallOwner();
  const iHave = dist(ai, ball) < PR+BR+2;
  let tx, ty;

  if (iHave) {
    tx = GL.x+GW; ty = GL.y+GH/2;
    const [dx,dy] = norm(tx-ai.x, ty-ai.y);
    ai.vx = dx*ai.speed; ai.vy = dy*ai.speed;
    if (ai.x < F.x+F.w*0.48) {
      const [bx,by] = norm(tx-ball.x, ty-ball.y);
      ball.vx = bx*7.5; ball.vy = by*7.5 + (Math.random()-.5)*3;
    }
  } else {
    if (owner === 0) {
      // Player has ball — defenders drop back, attackers press
      if (ai.role === 'def') {
        tx = GR.x-60; ty = GR.y+GH/2;
      } else {
        tx = ball.x; ty = ball.y;
      }
    } else {
      // Nobody has ball or another AI has it — always chase
      tx = ball.x; ty = ball.y;
    }
    const d = dist(ai,{x:tx,y:ty});
    const [dx,dy] = norm(tx-ai.x, ty-ai.y);
    ai.vx = d>5 ? dx*ai.speed : 0;
    ai.vy = d>5 ? dy*ai.speed : 0;
  }

  ai.x = clamp(ai.x+ai.vx, F.x+PR, F.x+F.w-PR);
  ai.y = clamp(ai.y+ai.vy, F.y+PR, F.y+F.h-PR);
}

// ─── Update ───────────────────────────────────────────────────────────────
function update(dt) {
  shootCooldown = Math.max(0, shootCooldown - dt);

  // Collect input
  let mdx = joy.active ? joy.dx : 0;
  let mdy = joy.active ? joy.dy : 0;
  if (keys['ArrowLeft']||keys['KeyA']) mdx -= 1;
  if (keys['ArrowRight']||keys['KeyD']) mdx += 1;
  if (keys['ArrowUp']||keys['KeyW'])   mdy -= 1;
  if (keys['ArrowDown']||keys['KeyS']) mdy += 1;

  const sprinting = touch.sprint || keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = player.speed * (sprinting ? 1.65 : 1);
  const [nx,ny] = norm(mdx, mdy);
  const moving = Math.hypot(mdx,mdy) > 0.1;
  player.vx = moving ? nx*speed : 0;
  player.vy = moving ? ny*speed : 0;
  player.x = clamp(player.x+player.vx, F.x+PR, F.x+F.w-PR);
  player.y = clamp(player.y+player.vy, F.y+PR, F.y+F.h-PR);

  // Keyboard shoot
  if (keys['Space']) { keys['Space']=false; triggerShoot(); }

  aiPlayers.forEach(a => updateAI(a));

  // Ball physics
  ball.vx *= 0.972; ball.vy *= 0.972;

  if (dist(player, ball) < PR+BR) { ball.vx += player.vx*.35; ball.vy += player.vy*.35; }
  aiPlayers.forEach(a => { if (dist(a,ball) < PR+BR) { ball.vx += a.vx*.35; ball.vy += a.vy*.35; }});

  // Goal zone: ball must be near the goal mouth AND in the correct y-band
  const inGoalYRange = ball.y > GL.y && ball.y < GL.y + GH; // same y for both goals
  const nearLeftGoal  = ball.x < F.x + 60;
  const nearRightGoal = ball.x > F.x + F.w - 60;
  const inGL = nearLeftGoal  && inGoalYRange;
  const inGR = nearRightGoal && inGoalYRange;

  // Wall bounces — allow ball through goal mouth only when actually at that goal
  if (ball.x - BR < F.x     && !inGL) { ball.x = F.x + BR;       ball.vx *= -.7; }
  if (ball.x + BR > F.x+F.w && !inGR) { ball.x = F.x + F.w - BR; ball.vx *= -.7; }
  if (ball.y - BR < F.y               ) { ball.y = F.y + BR;       ball.vy =  Math.abs(ball.vy) * .7; }
  if (ball.y + BR > F.y + F.h         ) { ball.y = F.y + F.h - BR; ball.vy = -Math.abs(ball.vy) * .7; }

  // Goal detection — ball exits through the goal opening
  if (!goalLock) {
    if (ball.x < F.x && inGoalYRange) {
      goalLock = true; score[1]++; playGoalSound();
      showMsg('⚽  GOAL!  Away scores!');
      setTimeout(() => { resetPositions(); hideMsg(); }, 2200);
    }
    if (ball.x > F.x + F.w && inGoalYRange) {
      goalLock = true; score[0]++; playGoalSound();
      showMsg('⚽  GOAL!  Home scores!');
      setTimeout(() => { resetPositions(); hideMsg(); }, 2200);
    }
  }

  // Timer
  timeLeft -= dt;
  if (timeLeft <= 0) {
    if (half === 1) {
      half = 2; timeLeft = 120; gameState = 'halftime';
      resetPositions();
      showMsg('HALF TIME\n\nTap anywhere for 2nd Half');
    } else {
      gameState = 'gameover'; stopMusic();
      const r = score[0]>score[1] ? 'Home Wins!' : score[1]>score[0] ? 'Away Wins!' : "It's a Draw!";
      showMsg(`FULL TIME\n${score[0]} – ${score[1]}\n${r}`);
    }
  }
}

// ─── Draw helpers ─────────────────────────────────────────────────────────
function lighten(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+60)},${Math.min(255,g+60)},${Math.min(255,b+60)})`;
}

function drawField() {
  // Grass
  const gr = ctx.createLinearGradient(0,F.y,0,F.y+F.h);
  gr.addColorStop(0,'#2d5a1b'); gr.addColorStop(1,'#1e3d12');
  ctx.fillStyle=gr; ctx.fillRect(F.x,F.y,F.w,F.h);

  // Stripes
  for (let i=0;i<8;i++) {
    ctx.fillStyle = i%2===0 ? 'rgba(0,0,0,0.06)' : 'transparent';
    ctx.fillRect(F.x+(F.w/8)*i, F.y, F.w/8, F.h);
  }

  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2;
  ctx.strokeRect(F.x,F.y,F.w,F.h);

  // Center line
  ctx.beginPath(); ctx.moveTo(F.x+F.w/2,F.y); ctx.lineTo(F.x+F.w/2,F.y+F.h); ctx.stroke();

  // Center circle
  ctx.beginPath(); ctx.arc(F.x+F.w/2,F.y+F.h/2,52,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(F.x+F.w/2,F.y+F.h/2,3,0,Math.PI*2); ctx.fill();

  // Penalty boxes
  ctx.strokeRect(F.x, F.y+F.h/2-75, 95, 150);
  ctx.strokeRect(F.x+F.w-95, F.y+F.h/2-75, 95, 150);

  // Goals
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.fillRect(GL.x-GW, GL.y, GW, GH);
  ctx.fillRect(GR.x+GW, GR.y, GW, GH);
  ctx.strokeStyle='white';
  ctx.strokeRect(GL.x-GW, GL.y, GW, GH);
  ctx.strokeRect(GR.x+GW, GR.y, GW, GH);
}

function drawPlayer(p, color, label) {
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(p.x+2,p.y+4,PR,PR*.5,0,0,Math.PI*2); ctx.fill();

  const g = ctx.createRadialGradient(p.x-3,p.y-3,2,p.x,p.y,PR);
  g.addColorStop(0,lighten(color)); g.addColorStop(1,color);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(p.x,p.y,PR,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='white'; ctx.font='bold 9px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,p.x,p.y);
}

function drawBall() {
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(ball.x+2,ball.y+3,BR,BR*.5,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(ball.x,ball.y,BR,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#222';  ctx.beginPath(); ctx.arc(ball.x,ball.y,BR*.35,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#555'; ctx.lineWidth=1;
  [[1,0],[0,1],[-1,-.5],[.7,-.8]].forEach(([ox,oy]) => {
    ctx.beginPath(); ctx.arc(ball.x+ox*BR*.6, ball.y+oy*BR*.6, BR*.25, 0, Math.PI*2); ctx.stroke();
  });
}

function drawHUD() {
  // Bar background
  const bg = ctx.createLinearGradient(0,0,0,HUD_H);
  bg.addColorStop(0,'#0f3460'); bg.addColorStop(1,'#0a2540');
  ctx.fillStyle=bg; ctx.fillRect(0,0,CW,HUD_H);

  // Border bottom
  ctx.fillStyle='#e94560'; ctx.fillRect(0,HUD_H-2,CW,2);

  // Team names
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.font='bold 13px Arial';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('HOME', 20, HUD_H/2);
  ctx.textAlign='right';
  ctx.fillText('AWAY', CW-20, HUD_H/2);

  // Score
  ctx.fillStyle='#e94560'; ctx.font='bold 30px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`${score[0]}  –  ${score[1]}`, CW/2, HUD_H/2);

  // Timer
  const m=Math.floor(timeLeft/60), s=Math.floor(timeLeft%60);
  ctx.fillStyle='white'; ctx.font='bold 15px Arial';
  ctx.textAlign='center';
  ctx.fillText(`${m}:${s.toString().padStart(2,'0')}`, CW/2, HUD_H/2+18);

  // Half
  ctx.fillStyle='#888'; ctx.font='11px Arial';
  ctx.fillText(`${half===1?'1st':'2nd'} Half`, CW/2, HUD_H/2+32);
}

function drawControls() {
  // Dark strip behind controls
  ctx.fillStyle='rgba(5,10,25,0.72)';
  ctx.fillRect(0, CTRL_Y, CW, CH-CTRL_Y);

  // Separator line
  ctx.fillStyle='rgba(233,69,96,0.35)'; ctx.fillRect(0,CTRL_Y,CW,2);

  // ── Joystick ──
  const jbx = joy.active ? joy.baseX : JOY.cx;
  const jby = joy.active ? joy.baseY : JOY.cy;

  // Outer ring
  ctx.beginPath(); ctx.arc(jbx, jby, JOY.r, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=2; ctx.stroke();

  // Cross guides
  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(jbx-JOY.r,jby); ctx.lineTo(jbx+JOY.r,jby); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(jbx,jby-JOY.r); ctx.lineTo(jbx,jby+JOY.r); ctx.stroke();

  // Arrow hints when idle
  if (!joy.active) {
    ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.font='18px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('▲', jbx, jby-JOY.r*.52);
    ctx.fillText('▼', jbx, jby+JOY.r*.52);
    ctx.fillText('◀', jbx-JOY.r*.55, jby);
    ctx.fillText('▶', jbx+JOY.r*.55, jby);
  }

  // Knob
  const kx = jbx + joy.dx*JOY.r;
  const ky = jby + joy.dy*JOY.r;
  const kg = ctx.createRadialGradient(kx-4,ky-4,2,kx,ky,JOY.knobR);
  kg.addColorStop(0,'rgba(255,255,255,0.9)'); kg.addColorStop(1,'rgba(200,200,220,0.7)');
  ctx.beginPath(); ctx.arc(kx,ky,JOY.knobR,0,Math.PI*2);
  ctx.fillStyle=kg; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5; ctx.stroke();

  // ── Sprint button ──
  ctx.beginPath(); ctx.arc(SPRINT.cx, SPRINT.cy, SPRINT.r, 0, Math.PI*2);
  ctx.fillStyle = touch.sprint ? 'rgba(255,210,0,0.75)' : 'rgba(255,210,0,0.25)';
  ctx.fill();
  ctx.strokeStyle = touch.sprint ? '#ffd200' : 'rgba(255,210,0,0.55)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='white'; ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('RUN', SPRINT.cx, SPRINT.cy);

  // ── Shoot button ──
  ctx.beginPath(); ctx.arc(SHOOT.cx, SHOOT.cy, SHOOT.r, 0, Math.PI*2);
  const sg = ctx.createRadialGradient(SHOOT.cx-8,SHOOT.cy-8,4,SHOOT.cx,SHOOT.cy,SHOOT.r);
  sg.addColorStop(0, touch.shoot ? 'rgba(255,100,130,0.95)' : 'rgba(233,69,96,0.65)');
  sg.addColorStop(1, touch.shoot ? 'rgba(180,20,50,0.95)'  : 'rgba(150,20,50,0.65)');
  ctx.fillStyle=sg; ctx.fill();
  ctx.strokeStyle='#e94560'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle='white'; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('SHOOT', SHOOT.cx, SHOOT.cy);
}

// ─── Message overlay ──────────────────────────────────────────────────────
let msgText = '';
function showMsg(t) { msgText = t; }
function hideMsg()  { msgText = ''; }

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);   ctx.arcTo(x+w, y,   x+w, y+r,   r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);   ctx.arcTo(x,   y+h, x,   y+h-r, r);
  ctx.lineTo(x,   y+r);   ctx.arcTo(x,   y,   x+r, y,     r);
  ctx.closePath();
}

function drawMsg() {
  if (!msgText) return;
  ctx.fillStyle='rgba(0,0,0,0.78)';
  roundRectPath(CW/2-200, CH/2-90, 400, 180, 16); ctx.fill();
  ctx.strokeStyle='#e94560'; ctx.lineWidth=2; ctx.stroke();

  ctx.fillStyle='white'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const lines = msgText.split('\n');
  const lineH = 36;
  const startY = CH/2 - (lines.length-1)*lineH/2;
  lines.forEach((line, i) => {
    ctx.font = i===0 ? 'bold 26px Arial' : '20px Arial';
    ctx.fillStyle = i===0 ? '#e94560' : 'white';
    ctx.fillText(line, CW/2, startY + i*lineH);
  });
}

// ─── Render ───────────────────────────────────────────────────────────────
function render() {
  // Background
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,CW,CH);

  drawField();
  drawBall();
  drawPlayer(player, '#1565c0', 'P');
  aiPlayers.forEach((a,i) => drawPlayer(a, '#c62828', `${i+1}`));
  drawHUD();
  drawControls();
  drawMsg();
}

// ─── Game loop ────────────────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (gameState === 'playing') update(dt);
  render();
  requestAnimationFrame(loop);
}

// ─── Start / restart ──────────────────────────────────────────────────────
function startGame() {
  initAudio();
  if (gameState === 'gameover') {
    score=[0,0]; half=1; timeLeft=120; resetPositions();
  } else if (gameState === 'halftime') {
    timeLeft=120; resetPositions();
  } else if (gameState === 'waiting') {
    resetPositions();
  }
  gameState = 'playing';
  hideMsg();
  if (!musicPlaying) startMusic();
}

// ─── Init ─────────────────────────────────────────────────────────────────
resetPositions();
showMsg('CL SOCCER\n\nTap anywhere to kick off\n🔵 You   🔴 AI');
requestAnimationFrame(ts => { lastTime=ts; requestAnimationFrame(loop); });
</script>
</body>
