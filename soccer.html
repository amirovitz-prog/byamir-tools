<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champions League Soccer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Arial', sans-serif; color: white; overflow: hidden; }
#scoreboard { background: linear-gradient(135deg, #0f3460, #16213e); border: 2px solid #e94560; border-radius: 12px; padding: 10px 30px; margin-bottom: 10px; display: flex; align-items: center; gap: 30px; font-size: 22px; font-weight: bold; box-shadow: 0 0 20px rgba(233,69,96,0.4); }
#score { font-size: 36px; color: #e94560; min-width: 80px; text-align: center; }
#timer { font-size: 20px; color: #f5f5f5; }
#half-display { font-size: 14px; color: #aaa; }
#canvas-container { position: relative; }
canvas { border: 3px solid #e94560; border-radius: 8px; display: block; box-shadow: 0 0 30px rgba(233,69,96,0.3); }
#controls { margin-top: 10px; font-size: 13px; color: #aaa; text-align: center; line-height: 1.8; }
#controls span { color: #e94560; font-weight: bold; }
#message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); border: 2px solid #e94560; border-radius: 12px; padding: 20px 40px; font-size: 28px; font-weight: bold; text-align: center; display: none; z-index: 10; pointer-events: none; }
#start-btn { margin-top: 12px; padding: 10px 30px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
#start-btn:hover { background: #c73652; }
</style>
</head>
<body>

<div id="scoreboard">
  <div>HOME</div>
  <div id="score">0 - 0</div>
  <div>AWAY</div>
  <div style="margin-left:20px">
    <div id="timer">2:00</div>
    <div id="half-display">1st Half</div>
  </div>
</div>

<div id="canvas-container">
  <canvas id="field" width="800" height="500"></canvas>
  <div id="message">Press SPACE or click Start</div>
</div>

<div id="controls">
  <span>WASD / Arrow Keys</span> — move player &nbsp;|&nbsp; <span>SPACE</span> — shoot/tackle &nbsp;|&nbsp; <span>SHIFT</span> — sprint
</div>
<button id="start-btn" onclick="startGame()">Start Game</button>

<script>
// ─── Champions League tune via Web Audio API ───────────────────────────────
let audioCtx = null;
let musicPlaying = false;
let musicNodes = [];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playNote(freq, startTime, duration, vol = 0.15) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
  gain.gain.setValueAtTime(vol, startTime + duration - 0.05);
  gain.gain.linearRampToValueAtTime(0, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration);
  musicNodes.push(osc);
}

// Champions League anthem (simplified main phrase)
function playCLAnthem(loop = true) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const t = 0.32; // beat duration

  // Melody notes (approximate CL anthem opening)
  const melody = [
    [659,1],[659,0.5],[587,0.5],[659,1],[784,2],
    [740,1],[740,0.5],[659,0.5],[740,1],[880,2],
    [784,1],[784,0.5],[740,0.5],[784,1],[880,2],
    [1047,1],[988,1],[880,1],[784,1],
    [659,1],[659,0.5],[587,0.5],[659,1],[784,2],
    [740,1],[740,0.5],[659,0.5],[740,1],[523,2],
    [587,1],[659,1],[523,1],[440,1],
    [523,4]
  ];

  let time = now + 0.1;
  melody.forEach(([freq, beats]) => {
    playNote(freq, time, beats * t - 0.04, 0.12);
    time += beats * t;
  });

  const totalDuration = melody.reduce((s, [, b]) => s + b, 0) * t;

  if (loop) {
    window._clTimer = setTimeout(() => {
      if (musicPlaying) playCLAnthem(true);
    }, totalDuration * 1000);
  }
}

function startMusic() {
  initAudio();
  musicPlaying = true;
  playCLAnthem(true);
}

function stopMusic() {
  musicPlaying = false;
  clearTimeout(window._clTimer);
}

function playGoalSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const crowd = [523,659,784,1047];
  crowd.forEach((f, i) => playNote(f, now + i * 0.15, 0.4, 0.2));
}

// ─── Game State ────────────────────────────────────────────────────────────
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const FIELD = { x: 40, y: 40, w: W-80, h: H-80 };
const GOAL_W = 10, GOAL_H = 100;
const GOAL_L = { x: FIELD.x, y: FIELD.y + FIELD.h/2 - GOAL_H/2 };
const GOAL_R = { x: FIELD.x + FIELD.w - GOAL_W, y: FIELD.y + FIELD.h/2 - GOAL_H/2 };

let score = [0, 0];
let half = 1;
let timeLeft = 120; // 2 min
let gameState = 'waiting'; // waiting, playing, halftime, gameover
let lastTime = 0;
let keys = {};

const PLAYER_R = 14;
const BALL_R = 9;
const AI_COUNT = 4;

let player, ball, aiPlayers;

function resetPositions() {
  player = { x: FIELD.x + FIELD.w * 0.25, y: FIELD.y + FIELD.h/2, vx:0, vy:0, speed: 3.5, hasBall: false, team: 0 };
  ball = { x: FIELD.x + FIELD.w/2, y: FIELD.y + FIELD.h/2, vx: 0, vy: 0 };
  aiPlayers = [];
  // 2 defenders, 2 attackers
  const positions = [
    {x: 0.65, y: 0.35}, {x: 0.65, y: 0.65},
    {x: 0.80, y: 0.45}, {x: 0.80, y: 0.55}
  ];
  positions.forEach((p, i) => {
    aiPlayers.push({ x: FIELD.x + FIELD.w * p.x, y: FIELD.y + FIELD.h * p.y, vx:0, vy:0, speed: 2.8, hasBall: false, team: 1, role: i < 2 ? 'def' : 'att' });
  });
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function norm(dx, dy) { const m = Math.hypot(dx, dy) || 1; return [dx/m, dy/m]; }

// ─── Input ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── AI ────────────────────────────────────────────────────────────────────
function updateAI(ai, dt) {
  let tx, ty;
  const ballOwner = getBallOwner();
  const iHaveBall = dist(ai, ball) < PLAYER_R + BALL_R + 2;

  if (iHaveBall) {
    ai.hasBall = true;
    // dribble toward goal
    tx = GOAL_L.x + GOAL_W;
    ty = GOAL_L.y + GOAL_H/2;
    const [dx, dy] = norm(tx - ai.x, ty - ai.y);
    ai.vx = dx * ai.speed;
    ai.vy = dy * ai.speed;
    // shoot if close enough
    if (ai.x < FIELD.x + FIELD.w * 0.45) {
      const [bx, by] = norm(tx - ball.x, ty - ball.y);
      ball.vx = bx * 7;
      ball.vy = by * 7 + (Math.random()-0.5)*3;
    }
  } else {
    ai.hasBall = false;
    if (ballOwner === 1 || (!ballOwner && ball.x > FIELD.x + FIELD.w*0.5)) {
      // chase ball
      tx = ball.x; ty = ball.y;
    } else {
      // defend
      if (ai.role === 'def') {
        tx = GOAL_R.x - 60; ty = GOAL_R.y + GOAL_H/2;
      } else {
        tx = FIELD.x + FIELD.w * 0.65; ty = FIELD.y + FIELD.h/2;
      }
    }
    const [dx, dy] = norm(tx - ai.x, ty - ai.y);
    const d = dist(ai, {x:tx, y:ty});
    const s = d > 5 ? ai.speed : 0;
    ai.vx = dx * s; ai.vy = dy * s;
  }

  ai.x = clamp(ai.x + ai.vx, FIELD.x + PLAYER_R, FIELD.x + FIELD.w - PLAYER_R);
  ai.y = clamp(ai.y + ai.vy, FIELD.y + PLAYER_R, FIELD.y + FIELD.h - PLAYER_R);
}

function getBallOwner() {
  if (dist(player, ball) < PLAYER_R + BALL_R + 2) return 0;
  for (const ai of aiPlayers) if (dist(ai, ball) < PLAYER_R + BALL_R + 2) return 1;
  return null;
}

// ─── Update ────────────────────────────────────────────────────────────────
function update(dt) {
  // Player movement
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'] ? 1.6 : 1;
  const pSpeed = player.speed * sprint;
  const [nx, ny] = norm(dx, dy);
  player.vx = dx !== 0 || dy !== 0 ? nx * pSpeed : 0;
  player.vy = dx !== 0 || dy !== 0 ? ny * pSpeed : 0;
  player.x = clamp(player.x + player.vx, FIELD.x + PLAYER_R, FIELD.x + FIELD.w - PLAYER_R);
  player.y = clamp(player.y + player.vy, FIELD.y + PLAYER_R, FIELD.y + FIELD.h - PLAYER_R);

  // Shoot / tackle
  if (keys['Space']) {
    keys['Space'] = false; // consume
    const d = dist(player, ball);
    if (d < PLAYER_R + BALL_R + 10) {
      // kick toward right goal (AI goal)
      const tx = GOAL_R.x, ty = GOAL_R.y + GOAL_H/2;
      const [bx, by] = norm(tx - ball.x, ty - ball.y);
      ball.vx = bx * 9 + player.vx * 0.5;
      ball.vy = by * 9 + player.vy * 0.5 + (Math.random()-0.5)*2;
    }
  }

  // AI
  aiPlayers.forEach(ai => updateAI(ai, dt));

  // Ball physics
  ball.vx *= 0.97;
  ball.vy *= 0.97;

  // Ball-player collision (dribble)
  if (dist(player, ball) < PLAYER_R + BALL_R) {
    ball.vx += player.vx * 0.3;
    ball.vy += player.vy * 0.3;
  }

  // AI-ball collision
  aiPlayers.forEach(ai => {
    if (dist(ai, ball) < PLAYER_R + BALL_R) {
      ball.vx += ai.vx * 0.3;
      ball.vy += ai.vy * 0.3;
    }
  });

  // Ball walls
  if (ball.x - BALL_R < FIELD.x) { ball.x = FIELD.x + BALL_R; ball.vx *= -0.7; }
  if (ball.x + BALL_R > FIELD.x + FIELD.w) { ball.x = FIELD.x + FIELD.w - BALL_R; ball.vx *= -0.7; }

  // Goal area — allow ball through goal opening
  const inGoalL = ball.y > GOAL_L.y && ball.y < GOAL_L.y + GOAL_H;
  const inGoalR = ball.y > GOAL_R.y && ball.y < GOAL_R.y + GOAL_H;

  if (ball.y - BALL_R < FIELD.y && !inGoalL && !inGoalR) { ball.y = FIELD.y + BALL_R; ball.vy *= -0.7; }
  if (ball.y + BALL_R > FIELD.y + FIELD.h && !inGoalL && !inGoalR) { ball.y = FIELD.y + FIELD.h - BALL_R; ball.vy *= -0.7; }
  if (ball.y - BALL_R < FIELD.y) ball.vy = Math.abs(ball.vy);
  if (ball.y + BALL_R > FIELD.y + FIELD.h) ball.vy = -Math.abs(ball.vy);

  // Goal detection
  if (ball.x - BALL_R < GOAL_L.x && ball.y > GOAL_L.y && ball.y < GOAL_L.y + GOAL_H) {
    score[1]++;
    playGoalSound();
    showGoal('GOAL! Away scores!');
    setTimeout(() => { resetPositions(); hideMessage(); }, 2000);
  }
  if (ball.x + BALL_R > GOAL_R.x + GOAL_W && ball.y > GOAL_R.y && ball.y < GOAL_R.y + GOAL_H) {
    score[0]++;
    playGoalSound();
    showGoal('GOAL! Home scores!');
    setTimeout(() => { resetPositions(); hideMessage(); }, 2000);
  }

  // Timer
  timeLeft -= dt;
  if (timeLeft <= 0) {
    if (half === 1) {
      half = 2;
      timeLeft = 120;
      showMessage('Half Time!\nClick Start for 2nd Half');
      gameState = 'halftime';
      resetPositions();
    } else {
      gameState = 'gameover';
      stopMusic();
      const result = score[0] > score[1] ? 'Home Wins!' : score[1] > score[0] ? 'Away Wins!' : "It's a Draw!";
      showMessage(`FULL TIME\n${score[0]} - ${score[1]}\n${result}`);
    }
  }
}

// ─── Draw ──────────────────────────────────────────────────────────────────
function drawField() {
  // Grass
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2d5a1b');
  grad.addColorStop(1, '#1e3d12');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stripes
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? 'rgba(0,0,0,0.06)' : 'transparent';
    ctx.fillRect(FIELD.x + (FIELD.w/8)*i, FIELD.y, FIELD.w/8, FIELD.h);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;

  // Boundary
  ctx.strokeRect(FIELD.x, FIELD.y, FIELD.w, FIELD.h);

  // Center line
  ctx.beginPath();
  ctx.moveTo(FIELD.x + FIELD.w/2, FIELD.y);
  ctx.lineTo(FIELD.x + FIELD.w/2, FIELD.y + FIELD.h);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(FIELD.x + FIELD.w/2, FIELD.y + FIELD.h/2, 55, 0, Math.PI*2);
  ctx.stroke();

  // Center dot
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(FIELD.x + FIELD.w/2, FIELD.y + FIELD.h/2, 3, 0, Math.PI*2);
  ctx.fill();

  // Penalty areas
  ctx.strokeRect(FIELD.x, FIELD.y + FIELD.h/2 - 80, 100, 160);
  ctx.strokeRect(FIELD.x + FIELD.w - 100, FIELD.y + FIELD.h/2 - 80, 100, 160);

  // Goals
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(GOAL_L.x - GOAL_W, GOAL_L.y, GOAL_W, GOAL_H);
  ctx.fillRect(GOAL_R.x + GOAL_W, GOAL_R.y, GOAL_W, GOAL_H);
  ctx.strokeStyle = 'white';
  ctx.strokeRect(GOAL_L.x - GOAL_W, GOAL_L.y, GOAL_W, GOAL_H);
  ctx.strokeRect(GOAL_R.x + GOAL_W, GOAL_R.y, GOAL_W, GOAL_H);
}

function drawPlayer(p, color, label) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(p.x + 2, p.y + 4, PLAYER_R, PLAYER_R * 0.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  const g = ctx.createRadialGradient(p.x - 3, p.y - 3, 2, p.x, p.y, PLAYER_R);
  g.addColorStop(0, lighten(color));
  g.addColorStop(1, color);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, PLAYER_R, 0, Math.PI*2);
  ctx.fill();

  // Jersey number / label
  ctx.fillStyle = 'white';
  ctx.font = 'bold 9px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, p.x, p.y);
}

function lighten(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+60)},${Math.min(255,g+60)},${Math.min(255,b+60)})`;
}

function drawBall() {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(ball.x + 2, ball.y + 3, BALL_R, BALL_R*0.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Ball
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fill();

  // Pentagons (simplified)
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R * 0.35, 0, Math.PI*2);
  ctx.fill();

  // Stripe
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  const offsets = [[1,0],[0,1],[-1,-0.5],[0.7,-0.8]];
  offsets.forEach(([ox, oy]) => {
    ctx.beginPath();
    ctx.arc(ball.x + ox*BALL_R*0.6, ball.y + oy*BALL_R*0.6, BALL_R*0.25, 0, Math.PI*2);
    ctx.stroke();
  });
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawField();
  drawBall();
  drawPlayer(player, '#1565c0', 'P');
  aiPlayers.forEach((ai, i) => drawPlayer(ai, '#c62828', `${i+1}`));

  // HUD
  document.getElementById('score').textContent = `${score[0]} - ${score[1]}`;
  const m = Math.floor(timeLeft / 60);
  const s = Math.floor(timeLeft % 60);
  document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('half-display').textContent = `${half === 1 ? '1st' : '2nd'} Half`;
}

// ─── Messages ──────────────────────────────────────────────────────────────
function showMessage(txt) {
  const el = document.getElementById('message');
  el.style.display = 'block';
  el.innerHTML = txt.replace(/\n/g, '<br>');
}
function hideMessage() {
  document.getElementById('message').style.display = 'none';
}
function showGoal(txt) {
  const el = document.getElementById('message');
  el.style.display = 'block';
  el.innerHTML = `⚽ ${txt}`;
}

// ─── Game Loop ─────────────────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (gameState === 'playing') update(dt);
  render();
  requestAnimationFrame(loop);
}

function startGame() {
  initAudio();
  if (gameState === 'gameover') {
    score = [0, 0];
    half = 1;
    timeLeft = 120;
  } else if (gameState === 'halftime') {
    timeLeft = 120;
  } else if (gameState === 'waiting') {
    resetPositions();
  }
  gameState = 'playing';
  hideMessage();
  if (!musicPlaying) startMusic();
  document.getElementById('start-btn').textContent = half === 1 ? 'Restart' : '2nd Half';
}

// Init
resetPositions();
showMessage('Press Start to Play\n\n🔵 Blue = You &nbsp; 🔴 Red = AI');
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
